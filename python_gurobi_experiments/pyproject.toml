[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cop-gurobi-experiments"
version = "1.0.0"
description = "Reproducible Python/Gurobi experiments for order-preserving AHP models"
requires-python = ">=3.11"
dependencies = [
  "gurobipy==12.0.0",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "matplotlib>=3.8",
  "psutil==5.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
