[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cop-gurobi-experiments"
version = "1.0.0"
description = "Order-preserving pairwise preference models implemented with Python and Gurobi"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
authors = [
  {name = "Jiancheng Tu"},
  {name = "Zhibin Wu"},
  {name = "Chuankai Xiang"},
  {name = "Yueyuan Li"}
]
keywords = [
  "pairwise comparisons",
  "AHP",
  "order preservation",
  "MNVDM",
  "EVRIM",
  "Gurobi"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "gurobipy>=12.0,<13",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8"
]

[project.urls]
Homepage = "https://github.com/Tommytutu/COP"
Repository = "https://github.com/Tommytutu/COP"
Documentation = "https://github.com/Tommytutu/COP#readme"
Issues = "https://github.com/Tommytutu/COP/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.4",
  "twine>=5.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
